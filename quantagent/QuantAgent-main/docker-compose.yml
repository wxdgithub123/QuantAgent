services:
  # PostgreSQL Database
  postgres:
    image: pgvector/pgvector:pg16
    container_name: quantagent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: quantagent
      POSTGRES_PASSWORD: quantagent
      POSTGRES_DB: quantagent
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # NOTE: init-scripts removed — schema is managed by Alembic migrations.
      # Existing databases: run 'python scripts/run_migrations.py stamp 001' to transition.
      # Fresh databases: Alembic creates all tables on first backend startup.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantagent"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quantagent-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: quantagent-redis
    restart: unless-stopped
    ports:
      - "6382:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quantagent-network

  # ClickHouse — Time-Series Analytics (K-line history, backtest data)
  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: quantagent-clickhouse
    restart: unless-stopped
    ports:
      - "8124:8123"   # HTTP interface
      - "9001:9000"   # Native TCP interface
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    # Note: ClickHouse health check disabled - service starts successfully without it
    # The backend will handle connection retries gracefully
    networks:
      - quantagent-network

  # NATS — Message Queue for market data pub/sub (Phase B)
  nats:
    image: nats:2.10-alpine
    container_name: quantagent-nats
    restart: unless-stopped
    ports:
      - "4223:4222"   # Client connections
      - "8223:8222"   # HTTP monitoring
    command: ["-m", "8222", "--jetstream"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quantagent-network

  # Go Gateway (NATS Publisher & Order Executor)
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: quantagent-gateway
    restart: unless-stopped
    environment:
      - NATS_URL=nats://nats:4222
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_SECRET_KEY=${BINANCE_SECRET_KEY}
      - BINANCE_TESTNET=true
      - SYMBOLS=BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,DOGEUSDT
      - BINANCE_PROXY=${BINANCE_PROXY:-}
    depends_on:
      nats:
        condition: service_healthy
    networks:
      - quantagent-network

  # Hummingbot Postgres — Hummingbot API 专用数据库
  hummingbot-postgres:
    image: pgvector/pgvector:pg16
    container_name: hummingbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hbot
      POSTGRES_PASSWORD: hummingbot-api
      POSTGRES_DB: hummingbot_api
    ports:
      - "5436:5432"
    volumes:
      - hummingbot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hbot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quantagent-network

  # MQTT Broker — Hummingbot API 用 MQTT 与 Bot 实例通信
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "hc-$$RANDOM", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quantagent-network

  # Hummingbot API (FastAPI) — 可选，仅在需要 Paper Bot 功能时启用
  # 构建：docker compose build hummingbot-api
  hummingbot-api:
    build:
      context: .
      dockerfile: Dockerfile.hummingbot-api
    container_name: hummingbot-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    profiles:
      - hummingbot   # 仅在显式指定 profile 时启动: docker compose --profile hummingbot up
    volumes:
      # Docker socket — 允许容器内创建 Bot 子容器（必须）
      - /var/run/docker.sock:/var/run/docker.sock
      # Hummingbot 数据目录（Bot 实例状态）
      - ./hummingbot_data:/home/hummingbot/data
      # bots 目录
      - ./hummingbot_data/bots:/hummingbot-api/bots
    environment:
      # BOTS_HOST_PATH: 宿主机上 hummingbot_data/bots 的绝对路径（必填）
      # 例如 Linux: /home/user/QuantAgent/hummingbot_data/bots
      # 例如 macOS: /Users/xxx/QuantAgent/hummingbot_data/bots
      # 例如 Windows: A:/project/Hummingbot/hummingbot_data/bots
      - BOTS_HOST_PATH=${BOTS_HOST_PATH}
      - DOCKER_HOST=unix:///var/run/docker.sock
      - BROKER_HOST=mosquitto
      - BROKER_PORT=1883
      - BROKER_USERNAME=admin
      - BROKER_PASSWORD=password
      - DOCKER_NETWORK=quantagent-main_quantagent-network
      # Proxy（可选）— 如需科学上网访问 Binance，在这里配置
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=localhost,127.0.0.1,mosquitto,hummingbot-postgres
    depends_on:
      hummingbot-postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    networks:
      - quantagent-network

  # TradingAgents Decision Service (isolated dependency stack)
  tradingagents-service:
    build:
      context: ./tradingagents-service
      dockerfile: Dockerfile
    container_name: quantagent-tradingagents-service
    restart: unless-stopped
    ports:
      - "8010:8010"
    environment:
      - TRADINGAGENTS_MODE=${TRADINGAGENTS_MODE:-quantagent_patched_graph}
      - TRADINGAGENTS_LLM_PROVIDER=${TRADINGAGENTS_LLM_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_API_BASE=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - TRADINGAGENTS_OPENAI_TIMEOUT_SECONDS=${TRADINGAGENTS_OPENAI_TIMEOUT_SECONDS:-60}
      - TRADINGAGENTS_NATIVE_LLM_PROVIDER=${TRADINGAGENTS_NATIVE_LLM_PROVIDER:-openai}
      - TRADINGAGENTS_NATIVE_QUICK_MODEL=${TRADINGAGENTS_NATIVE_QUICK_MODEL:-gpt-4o-mini}
      - TRADINGAGENTS_NATIVE_DEEP_MODEL=${TRADINGAGENTS_NATIVE_DEEP_MODEL:-gpt-4o-mini}
      - TRADINGAGENTS_NATIVE_ANALYSTS=${TRADINGAGENTS_NATIVE_ANALYSTS:-market,news,social,fundamentals}
      - TRADINGAGENTS_NATIVE_RESPONSE_LANGUAGE=${TRADINGAGENTS_NATIVE_RESPONSE_LANGUAGE:-zh-CN}
      - TRADINGAGENTS_NATIVE_REASONING_EFFORT=${TRADINGAGENTS_NATIVE_REASONING_EFFORT:-low}
      - TRADINGAGENTS_NATIVE_DISABLE_REASONING_EFFORT=${TRADINGAGENTS_NATIVE_DISABLE_REASONING_EFFORT:-true}
      - TRADINGAGENTS_NATIVE_MAX_DEBATE_ROUNDS=${TRADINGAGENTS_NATIVE_MAX_DEBATE_ROUNDS:-1}
      - TRADINGAGENTS_NATIVE_MAX_RISK_ROUNDS=${TRADINGAGENTS_NATIVE_MAX_RISK_ROUNDS:-1}
      - TRADINGAGENTS_NATIVE_MAX_RECUR_LIMIT=${TRADINGAGENTS_NATIVE_MAX_RECUR_LIMIT:-60}
      - TRADINGAGENTS_NATIVE_RESULTS_DIR=/tmp/tradingagents-native-results
      - TRADINGAGENTS_PATCHED_ANALYSTS=${TRADINGAGENTS_PATCHED_ANALYSTS:-market,news,social,fundamentals}
      - TRADINGAGENTS_PATCHED_QUICK_MODEL=${TRADINGAGENTS_PATCHED_QUICK_MODEL:-gpt-4o-mini}
      - TRADINGAGENTS_PATCHED_DEEP_MODEL=${TRADINGAGENTS_PATCHED_DEEP_MODEL:-gpt-4o-mini}
      - TRADINGAGENTS_PATCHED_RESPONSE_LANGUAGE=${TRADINGAGENTS_PATCHED_RESPONSE_LANGUAGE:-zh-CN}
      - TRADINGAGENTS_PATCHED_REASONING_EFFORT=${TRADINGAGENTS_PATCHED_REASONING_EFFORT:-low}
      - TRADINGAGENTS_PATCHED_MAX_DEBATE_ROUNDS=${TRADINGAGENTS_PATCHED_MAX_DEBATE_ROUNDS:-1}
      - TRADINGAGENTS_PATCHED_MAX_RISK_ROUNDS=${TRADINGAGENTS_PATCHED_MAX_RISK_ROUNDS:-1}
      - TRADINGAGENTS_PATCHED_MAX_RECUR_LIMIT=${TRADINGAGENTS_PATCHED_MAX_RECUR_LIMIT:-60}
      - TRADINGAGENTS_PATCHED_RESULTS_DIR=/tmp/tradingagents-patched-results
      - TRADINGAGENTS_USE_OLLAMA=${TRADINGAGENTS_USE_OLLAMA:-true}
      - TRADINGAGENTS_OLLAMA_TIMEOUT_SECONDS=${TRADINGAGENTS_OLLAMA_TIMEOUT_SECONDS:-45}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:1.5b}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=host.docker.internal,host-gateway,ollama,localhost,127.0.0.1,tradingagents-service,backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=3).read()"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - quantagent-network

  # Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quantagent-backend
    restart: unless-stopped
    ports:
      - "8002:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://quantagent:quantagent@postgres:5432/quantagent
      - REDIS_URL=redis://redis:6379/0
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_DB=quantagent
      - NATS_URL=nats://nats:4222
      - DEBUG=true
      - HOST=0.0.0.0
      - PORT=8000
      - BINANCE_PRIVATE_KEY_PATH=/app/Private_key.pem
      # 代理（可选）— 如需科学上网访问 Binance/CoinGecko，在这里配置
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      # Ollama 使用 host.docker.internal 访问宿主机（可选，AI 分析功能需要）
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:1.5b}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENBB_FRED_API_KEY=${OPENBB_FRED_API_KEY:-}
      - USE_TRADINGAGENTS=${USE_TRADINGAGENTS:-true}
      - TRADINGAGENTS_SERVICE_URL=${TRADINGAGENTS_SERVICE_URL:-http://tradingagents-service:8010}
      - TRADINGAGENTS_TIMEOUT_SECONDS=${TRADINGAGENTS_TIMEOUT_SECONDS:-300}
      # 禁用 Ollama 请求的代理
      - NO_PROXY=host.docker.internal,host-gateway,ollama,localhost,127.0.0.1,host.docker.internal:11434,backend,postgres,redis,nats,clickhouse,frontend,gateway,hummingbot-api,tradingagents-service,172.19.0.0/16
      # CORS 配置，允许前端访问 (逗号分隔)
      - CORS_ORIGINS=http://frontend:3000,http://localhost:3002
      # Hummingbot API 集成（只读）
      # 注意：Hummingbot 也运行在 Docker 网络中，通过 Docker 内部 DNS 访问
      - HUMMINGBOT_API_URL=${HUMMINGBOT_API_URL:-http://hummingbot-api:8000}
      # 认证：Hummingbot API 默认使用 HTTP Basic Auth（admin:admin）
      # 如果 .env 文件中没有设置这两个变量，backend 调用时会收到 401
      - HUMMINGBOT_API_USERNAME=${HUMMINGBOT_API_USERNAME:-admin}
      - HUMMINGBOT_API_PASSWORD=${HUMMINGBOT_API_PASSWORD:-admin}
      - HUMMINGBOT_API_TIMEOUT=${HUMMINGBOT_API_TIMEOUT:-10}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_started
    networks:
      - quantagent-network
    # 添加 extra_hosts 映射，使容器能访问宿主机
    extra_hosts:
      - "host-gateway:host-gateway"
      - "host.docker.internal:host-gateway"
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quantagent-frontend
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NEXT_PUBLIC_WS_URL=ws://backend:8000/ws/market
      - TRADINGAGENTS_SERVICE_URL=http://tradingagents-service:8010
    volumes:
      - ./frontend:/app
      - /app/.next           # 排除 .next，使用容器内部目录（避免 lockfile 权限问题）
      - /app/node_modules    # 排除 node_modules，使用容器内部依赖
    depends_on:
      - backend
    networks:
      - quantagent-network
    command: sh -c "cd /app && sh start.sh"

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
  hummingbot_postgres_data:

networks:
  quantagent-network:
    driver: bridge
